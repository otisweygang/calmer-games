<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colour Match</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="game-header">
    <a id="ls-exit" href="../../index.html" aria-label="Exit">Exit</a>
  </header>

  <main class="game-area" id="game-area">
    <section id="setup-screen" class="screen">
      <div class="panel settings-panel" aria-label="Settings">
        <h1 class="setup-title">Colour Match</h1>
        <p class="setup-intro">Set up your game, then start.</p>

        <div class="settings-groups">
          <div class="settings-row">
            <span class="settings-row-label" id="size-label">Grid size</span>
            <div class="segmented" role="group" aria-labelledby="size-label" id="size-options"></div>
          </div>

          <div class="settings-row">
            <span class="settings-row-label" id="colours-label">Number of colours</span>
            <div class="segmented" role="group" aria-labelledby="colours-label" id="colour-count-options"></div>
          </div>

          <div class="settings-row">
            <span class="settings-row-label" id="mode-label">Pattern</span>
            <div class="segmented" role="group" aria-labelledby="mode-label" id="mode-options"></div>
          </div>

          <div class="settings-row" id="picture-row" hidden>
            <span class="settings-row-label" id="picture-label">Picture</span>
            <div class="segmented" role="group" aria-labelledby="picture-label" id="picture-options"></div>
          </div>
        </div>

        <button id="play-btn" type="button" class="play-btn">Play</button>
      </div>
    </section>

    <section id="play-screen" class="screen" hidden>
      <div class="play-toolbar">
        <button id="menu-btn" type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu-drawer">☰ Menu</button>
        <button id="how-to-play-btn" type="button" class="how-to-play-btn" aria-haspopup="true" aria-expanded="false" aria-controls="how-to-play">? How to play</button>
        <button id="new-pattern-btn" type="button" class="new-pattern-btn">New pattern</button>
      </div>

      <ol id="how-to-play" class="how-to-play" hidden>
        <li>Look at <strong>Match this</strong>.</li>
        <li>Pick a colour below.</li>
        <li>Tap squares in <strong>Your grid</strong> to paint them.</li>
      </ol>

      <div class="play-area-wrap" id="play-area-wrap">
        <div class="game-row-wrap" id="game-row-wrap">
          <div class="game-row" id="game-row">
            <div class="panel" aria-label="Pattern to match">
              <h2 class="section-label">Match this</h2>
              <div id="target-grid" class="grid grid-locked"></div>
            </div>

            <div class="panel" aria-label="Your grid">
              <h2 class="section-label">Your grid</h2>
              <div id="player-grid" class="grid"></div>
            </div>
          </div>
        </div>

        <div class="palette-panel" aria-label="Colour palette">
          <div id="palette" class="palette"></div>
        </div>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <div id="menu-backdrop" class="menu-backdrop" hidden></div>

    <aside id="menu-drawer" class="menu-drawer" hidden aria-label="Menu">
      <div class="menu-drawer-header">
        <h2 class="menu-drawer-title">Menu</h2>
        <button id="menu-close-btn" type="button" class="menu-close-btn" aria-label="Close menu">✕</button>
      </div>

      <div class="settings-groups menu-settings-groups">
        <div class="settings-row">
          <span class="settings-row-label" id="menu-size-label">Grid size</span>
          <div class="segmented" role="group" aria-labelledby="menu-size-label" id="menu-size-options"></div>
        </div>

        <div class="settings-row">
          <span class="settings-row-label" id="menu-colours-label">Number of colours</span>
          <div class="segmented" role="group" aria-labelledby="menu-colours-label" id="menu-colour-count-options"></div>
        </div>

        <div class="settings-row">
          <span class="settings-row-label" id="menu-mode-label">Pattern</span>
          <div class="segmented" role="group" aria-labelledby="menu-mode-label" id="menu-mode-options"></div>
        </div>

        <div class="settings-row" id="menu-picture-row" hidden>
          <span class="settings-row-label" id="menu-picture-label">Picture</span>
          <div class="segmented" role="group" aria-labelledby="menu-picture-label" id="menu-picture-options"></div>
        </div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
