<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a id="ls-exit" href="../../index.html" aria-label="Exit">Exit</a>

  <h1 id="title">Tetris</h1>

  <button id="menu-btn" type="button" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu-drawer" data-tooltip="Menu">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="11" cy="13" r="2.2" fill="currentColor" opacity="0.85"/>
      <circle cx="11" cy="20" r="2.2" fill="currentColor" opacity="0.6"/>
      <circle cx="11" cy="27" r="2.2" fill="currentColor" opacity="0.35"/>
      <path d="M17 13 H31M17 20 H31M17 27 H31" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="score-bar" hidden>
    <span id="score-label">Lines cleared</span>
    <strong id="score-value">0</strong>
  </div>

  <main id="board-wrap">
    <canvas id="board-canvas" aria-label="Tetris board"></canvas>
    <div id="next-wrap" aria-label="Next shape">
      <span id="next-label">Next</span>
      <canvas id="next-canvas"></canvas>
    </div>
  </main>

  <div id="full-board-panel" class="modal-backdrop" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="full-board-text">
      <p id="full-board-text">The board's full.</p>
      <button id="reset-btn" type="button" class="modal-btn modal-btn-primary">Start a fresh board</button>
    </div>
  </div>

  <div id="touch-controls" aria-label="Move and turn the shape">
    <button id="tc-left" type="button" class="tc-btn" aria-label="Move left">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M24 10 L14 20 L24 30" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="tc-rotate" type="button" class="tc-btn" aria-label="Rotate">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M28 15 A10 10 0 1 0 29.5 23" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M28 8 L29.5 16 L21.5 14.5 Z" fill="currentColor"/></svg>
    </button>
    <button id="tc-right" type="button" class="tc-btn" aria-label="Move right">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16 10 L26 20 L16 30" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="tc-down" type="button" class="tc-btn" aria-label="Move down">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 16 L20 26 L30 16" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="tc-drop" type="button" class="tc-btn tc-btn-wide" aria-label="Drop to bottom">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 12 L20 22 L30 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 24 L20 34 L30 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="menu-backdrop" class="menu-backdrop" hidden></div>

  <aside id="menu-drawer" class="menu-drawer" hidden aria-label="Menu">
    <div class="menu-drawer-header">
      <h2 class="menu-drawer-title">Menu</h2>
      <button id="menu-close-btn" type="button" class="menu-close-btn" aria-label="Close menu">✕</button>
    </div>

    <div class="settings-groups">
      <div class="settings-row">
        <span class="settings-row-label" id="score-setting-label">Show score</span>
        <div class="segmented" role="group" aria-labelledby="score-setting-label" id="score-toggle-options"></div>
      </div>
    </div>

    <button id="menu-reset-btn" type="button" class="menu-secondary-btn">Start a fresh board</button>
  </aside>

  <script src="script.js"></script>
</body>
</html>
