<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="game-header">
    <a id="ls-exit" href="../../index.html" aria-label="Back to home">← Home</a>
  </header>

  <main class="game-area" id="game-area">
    <section id="setup-screen" class="screen">
      <div class="panel settings-panel" aria-label="Settings">
        <h1 class="setup-title">Sudoku</h1>
        <p class="setup-intro">Pick a difficulty, then start.</p>

        <div class="settings-row">
          <span class="settings-row-label" id="difficulty-label">Difficulty</span>
          <div class="segmented" role="group" aria-labelledby="difficulty-label" id="difficulty-options"></div>
        </div>

        <button id="play-btn" type="button" class="play-btn">Play</button>
      </div>
    </section>

    <section id="play-screen" class="screen" hidden>
      <div class="play-toolbar">
        <button id="menu-btn" type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu-drawer">☰ Menu</button>
        <button id="new-puzzle-btn" type="button" class="new-puzzle-btn">New puzzle</button>
      </div>

      <div class="panel board-panel" aria-label="Sudoku board">
        <div id="board" class="board"></div>
      </div>

      <div aria-label="Number pad">
        <div id="number-pad" class="number-pad"></div>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <div id="menu-backdrop" class="menu-backdrop" hidden></div>

    <aside id="menu-drawer" class="menu-drawer" hidden aria-label="Menu">
      <div class="menu-drawer-header">
        <h2 class="menu-drawer-title">Menu</h2>
        <button id="menu-close-btn" type="button" class="menu-close-btn" aria-label="Close menu">✕</button>
      </div>

      <div class="settings-groups menu-settings-groups">
        <div class="settings-row">
          <span class="settings-row-label" id="menu-difficulty-label">Difficulty</span>
          <div class="segmented" role="group" aria-labelledby="menu-difficulty-label" id="menu-difficulty-options"></div>
        </div>
      </div>
    </aside>
  </main>

  <script src="vendor/sudoku.js"></script>
  <script src="script.js"></script>
</body>
</html>
