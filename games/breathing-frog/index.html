<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breathing Frog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="game-header">
    <a id="ls-exit" href="../../index.html" aria-label="Exit">Exit</a>
  </header>

  <main class="game-area" id="game-area">
    <section id="setup-screen" class="screen">
      <div class="panel settings-panel" aria-label="Settings">
        <h1 class="setup-title">Breathing Frog</h1>
        <p class="setup-intro">The frog breathes out and the pond moves. Breathe with him.</p>

        <div class="settings-groups">
          <div class="settings-row">
            <span class="settings-row-label" id="scene-label">Place</span>
            <div class="segmented" role="group" aria-labelledby="scene-label" id="scene-options"></div>
          </div>

          <div class="settings-row">
            <span class="settings-row-label" id="pattern-label">Breathing</span>
            <div class="segmented segmented--stack" role="group" aria-labelledby="pattern-label" id="pattern-options"></div>
          </div>

          <div class="settings-row">
            <span class="settings-row-label" id="sound-label">Sound</span>
            <div class="segmented" role="group" aria-labelledby="sound-label" id="sound-options"></div>
          </div>
        </div>

        <button id="play-btn" type="button" class="play-btn">Start</button>
      </div>
    </section>

    <section id="play-screen" class="screen" hidden>
      <!-- Toolbar floats over the scene so the pond is never boxed in by
           chrome. Fades down until hovered/focused. -->
      <div class="play-toolbar">
        <button id="menu-btn" type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu-drawer">☰ Menu</button>
        <button id="scene-btn" type="button" class="scene-btn">Change place</button>
        <button id="pause-btn" type="button" class="pause-btn">Pause</button>
      </div>

      <div class="pond" id="pond">
        <!-- Each scene is its own SVG, shown one at a time. Switching
             only toggles which is visible — the breath state lives in
             script.js and the CSS variables, so changing place never
             restarts the cycle or moves the counter. -->

        <!-- ============ POND / FROG ============ -->
        <svg
          id="scene-frog"
          class="scene"
          data-scene="frog"
          viewBox="0 0 800 500"
          preserveAspectRatio="xMidYMid slice"
          role="img"
          aria-labelledby="scene-title"
          focusable="false"
        >
          <title id="scene-title">A frog on a lily pad, breathing on a quiet pond</title>

          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#cfe4ea" />
              <stop offset="55%" stop-color="#e6eedd" />
              <stop offset="100%" stop-color="#f3f0dd" />
            </linearGradient>

            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#b9d4cd" />
              <stop offset="45%" stop-color="#9cc3bc" />
              <stop offset="100%" stop-color="#7faea6" />
            </linearGradient>

            <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#a8cac3" />
              <stop offset="100%" stop-color="#7daba4" />
            </linearGradient>

            <radialGradient id="frogSkin" cx="42%" cy="28%" r="78%">
              <stop offset="0%" stop-color="#9cc47e" />
              <stop offset="55%" stop-color="#7aa863" />
              <stop offset="100%" stop-color="#5d8a4c" />
            </radialGradient>

            <radialGradient id="frogHead" cx="45%" cy="25%" r="80%">
              <stop offset="0%" stop-color="#a3cb84" />
              <stop offset="60%" stop-color="#7fac66" />
              <stop offset="100%" stop-color="#638e50" />
            </radialGradient>

            <linearGradient id="padTop" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8fbc84" />
              <stop offset="100%" stop-color="#6d9b6a" />
            </linearGradient>

            <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.85" />
              <stop offset="100%" stop-color="#fff6d8" stop-opacity="0" />
            </radialGradient>

            <!-- Slightly blue-white rather than pure white: against a pale
                 sky and pale water, pure white mist is invisible. -->
            <radialGradient id="mistPuff" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
              <stop offset="55%" stop-color="#eaf6f7" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#d6ecef" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- ---------- Sky and far bank ----------
               Sky and water are drawn well outside the default viewBox so
               that widening it for portrait screens (fitScene in
               script.js) never exposes bare background. -->
          <rect class="sky" x="-200" y="-400" width="1200" height="700" fill="url(#sky)" />
          <circle class="sun" cx="628" cy="96" r="130" fill="url(#sunGlow)" />
          <circle cx="628" cy="96" r="30" fill="#fdf3cf" opacity="0.75" />

          <!-- Far hills: drift very slightly, giving depth without motion
               that competes with the breath. -->
          <g class="layer-far">
            <ellipse cx="150" cy="292" rx="250" ry="72" fill="#b9cfae" opacity="0.55" />
            <ellipse cx="560" cy="296" rx="300" ry="60" fill="#aac5a2" opacity="0.5" />
            <ellipse cx="790" cy="290" rx="180" ry="66" fill="#c2d4b4" opacity="0.45" />
          </g>

          <!-- Far reeds sit on the bank, behind the water. -->
          <g class="layer-reeds-far" opacity="0.5">
            <path style="--lean: -1" d="M92 296 C88 256 96 232 104 210" />
            <path style="--lean: -1" d="M108 298 C106 262 100 240 92 222" />
            <path style="--lean: 1" d="M700 296 C704 258 698 234 690 214" />
            <path style="--lean: 1" d="M716 298 C714 262 722 238 730 220" />
            <path style="--lean: 1" d="M676 298 C672 268 678 248 684 232" />
          </g>

          <!-- ---------- Water ---------- -->
          <rect class="water" x="-200" y="296" width="1200" height="500" fill="url(#water)" />
          <rect x="-200" y="296" width="1200" height="6" fill="#d8e9e2" opacity="0.6" />

          <!-- Slow horizontal water bands, for a surface that is never
               perfectly static. -->
          <g class="water-bands" opacity="0.35">
            <ellipse cx="180" cy="340" rx="190" ry="5" fill="#d3e8e0" />
            <ellipse cx="620" cy="366" rx="220" ry="5" fill="#d3e8e0" />
            <ellipse cx="330" cy="404" rx="240" ry="6" fill="#cfe4dc" />
            <ellipse cx="640" cy="448" rx="200" ry="6" fill="#cfe4dc" />
          </g>

          <!-- Breath-driven surface rings, centred on the frog. -->
          <g class="breath-rings" aria-hidden="true">
            <ellipse class="breath-ring" cx="400" cy="392" rx="120" ry="26" />
            <ellipse class="breath-ring" cx="400" cy="392" rx="180" ry="38" />
            <ellipse class="breath-ring" cx="400" cy="392" rx="250" ry="52" />
          </g>

          <!-- Drifting particles the breath actually moves. Populated by
               script.js so counts can scale down on weak hardware. -->
          <g class="drift-layer" id="drift-layer" aria-hidden="true"></g>

          <!-- ---------- Lily pads ---------- -->
          <g class="pad-group pad-group--back">
            <ellipse cx="168" cy="356" rx="70" ry="19" fill="#6d9b6a" opacity="0.75" />
            <ellipse cx="648" cy="372" rx="58" ry="16" fill="#6d9b6a" opacity="0.7" />
          </g>

          <!-- ---------- The frog ---------- -->
          <g class="frog" id="frog">
            <!-- Reflection first, so the frog sits on top of it. -->
            <g class="frog-reflection" aria-hidden="true">
              <ellipse cx="400" cy="470" rx="96" ry="26" fill="#5d8a4c" opacity="0.16" />
            </g>

            <!-- Main pad, drawn under the frog. -->
            <g class="lily" id="lily">
              <ellipse cx="400" cy="404" rx="150" ry="36" fill="url(#padTop)" />
              <path d="M400 404 L474 384 A40 22 0 0 1 474 424 Z" fill="#e8f0dc" opacity="0.35" />
              <ellipse cx="400" cy="398" rx="150" ry="34" fill="#9cc48e" opacity="0.35" />
            </g>

            <!-- Body is deliberately NOT scaled with the breath. A real
                 frog holds its body still and inflates only the throat
                 sac; scaling the whole animal reads as a balloon, and as
                 a progress indicator. -->
            <g class="frog-body">
              <ellipse class="frog-haunch" cx="318" cy="374" rx="52" ry="34" />
              <ellipse class="frog-haunch" cx="482" cy="374" rx="52" ry="34" />

              <ellipse class="frog-torso" cx="400" cy="352" rx="94" ry="58" fill="url(#frogSkin)" />

              <!-- Dappled markings, so the skin is not a flat fill. -->
              <g class="frog-speckles" aria-hidden="true">
                <ellipse cx="356" cy="330" rx="13" ry="9" />
                <ellipse cx="440" cy="336" rx="10" ry="7" />
                <ellipse cx="392" cy="368" rx="15" ry="9" />
                <ellipse cx="330" cy="358" rx="9" ry="6" />
                <ellipse cx="462" cy="364" rx="11" ry="7" />
              </g>

              <ellipse class="frog-belly" cx="400" cy="374" rx="60" ry="32" />

              <g class="frog-head" id="frog-head">
                <ellipse class="frog-skull" cx="400" cy="290" rx="78" ry="52" fill="url(#frogHead)" />

                <circle class="frog-skull" cx="356" cy="256" r="30" fill="url(#frogHead)" />
                <circle class="frog-skull" cx="444" cy="256" r="30" fill="url(#frogHead)" />

                <g class="frog-eye" id="eye-left">
                  <ellipse class="frog-eye-ball" cx="356" cy="252" rx="17" ry="17" />
                  <ellipse class="frog-eye-pupil" cx="356" cy="253" rx="8" ry="9" />
                  <circle class="frog-eye-shine" cx="351" cy="247" r="3.4" />
                </g>

                <g class="frog-eye" id="eye-right">
                  <ellipse class="frog-eye-ball" cx="444" cy="252" rx="17" ry="17" />
                  <ellipse class="frog-eye-pupil" cx="444" cy="253" rx="8" ry="9" />
                  <circle class="frog-eye-shine" cx="439" cy="247" r="3.4" />
                </g>

                <path class="frog-mouth" d="M370 308 Q400 322 430 308" />
                <circle class="frog-nostril" cx="388" cy="296" r="2.6" />
                <circle class="frog-nostril" cx="412" cy="296" r="2.6" />
              </g>

            </g>
          </g>

          <!-- Mist the frog actually breathes out. -->
          <g class="mist-layer" id="mist-layer" aria-hidden="true"></g>

          <!-- ---------- Foreground ---------- -->
          <g class="layer-reeds-near" aria-hidden="true">
            <path style="--lean: -1" d="M40 500 C30 430 46 386 62 348" />
            <path style="--lean: -1" d="M66 500 C60 436 48 398 34 366" />
            <path style="--lean: -1" d="M96 500 C92 448 104 414 118 386" />
            <path style="--lean: 1" d="M744 500 C752 432 738 388 722 352" />
            <path style="--lean: 1" d="M716 500 C712 440 724 400 738 372" />
            <path style="--lean: 1" d="M686 500 C690 452 680 420 666 394" />
          </g>

          <ellipse class="foreground-pad" cx="120" cy="486" rx="120" ry="28" fill="#5f8d5e" opacity="0.5" />
          <ellipse class="foreground-pad" cx="700" cy="496" rx="130" ry="30" fill="#5f8d5e" opacity="0.45" />
        </svg>

        <!-- ============ OCEAN / WHALE ============
             Same mechanic, inverted direction: the exhale sends a column
             of bubbles UP toward the surface, and pushes kelp and
             plankton outward. -->
        <svg
          id="scene-whale"
          class="scene"
          data-scene="whale"
          viewBox="0 0 800 500"
          preserveAspectRatio="xMidYMid slice"
          role="img"
          aria-labelledby="whale-title"
          focusable="false"
          hidden
        >
          <title id="whale-title">A whale drifting in deep water, breathing out bubbles</title>

          <defs>
            <!-- Water is warmer and brighter at the surface, cold and
                 desaturated below, so depth reads without any drawn
                 horizon line. -->
            <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8fd3e2" />
              <stop offset="22%" stop-color="#5eaac8" />
              <stop offset="60%" stop-color="#2f6f9b" />
              <stop offset="100%" stop-color="#123a5f" />
            </linearGradient>

            <!-- Haze layered over the far water pushes the distant pod
                 back and keeps the midground from competing. -->
            <linearGradient id="waterHaze" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#9fdcea" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#9fdcea" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="whaleSkin" x1="0.2" y1="0" x2="0.5" y2="1">
              <stop offset="0%" stop-color="#4a6f9e" />
              <stop offset="45%" stop-color="#35547f" />
              <stop offset="100%" stop-color="#1d3557" />
            </linearGradient>

            <!-- Light in this scene comes from the surface, so the whale
                 gets a bright top edge and a dark underside. Without this
                 the animal reads as a flat sticker on the water. -->
            <linearGradient id="whaleLight" x1="0.3" y1="0" x2="0.45" y2="1">
              <stop offset="0%" stop-color="#bfe8fb" stop-opacity="0.42" />
              <stop offset="34%" stop-color="#bfe8fb" stop-opacity="0.06" />
              <stop offset="62%" stop-color="#0a1f3a" stop-opacity="0.18" />
              <stop offset="100%" stop-color="#07162b" stop-opacity="0.6" />
            </linearGradient>

            <!-- The pale ventral side of a rorqual, fading up into the
                 dark flank rather than meeting it as a hard edge. -->
            <!-- The chin is a separate, paler volume: a rorqual's throat
                 catches light from below and must not merge with the
                 flank above it. -->
            <linearGradient id="whaleChin" x1="0.2" y1="0" x2="0.4" y2="1">
              <stop offset="0%" stop-color="#43648f" />
              <stop offset="55%" stop-color="#6b8cb4" />
              <stop offset="100%" stop-color="#9db9d4" />
            </linearGradient>

            <linearGradient id="whaleBelly" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#cfe6f4" stop-opacity="0" />
              <stop offset="30%" stop-color="#cfe6f4" stop-opacity="0.18" />
              <stop offset="62%" stop-color="#dcedf8" stop-opacity="0.62" />
              <stop offset="100%" stop-color="#eaf5fc" stop-opacity="0.85" />
            </linearGradient>

            <radialGradient id="whaleShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#0a2035" stop-opacity="0.75" />
              <stop offset="65%" stop-color="#0a2035" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#0a2035" stop-opacity="0" />
            </radialGradient>

            <!-- Dappled caustic light from the surface, the same idea as
                 the frog's speckles: skin that is not one flat fill. -->
            <radialGradient id="whaleDapple" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#9ad4ef" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#9ad4ef" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="sunShaft" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#dff6fd" stop-opacity="0.55" />
              <stop offset="55%" stop-color="#dff6fd" stop-opacity="0.16" />
              <stop offset="100%" stop-color="#dff6fd" stop-opacity="0" />
            </linearGradient>

            <radialGradient id="bubbleFill" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="60%" stop-color="#d7f0fa" stop-opacity="0.4" />
              <stop offset="100%" stop-color="#bfe6f5" stop-opacity="0.1" />
            </radialGradient>

            <linearGradient id="kelpBlade" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#1d5a52" />
              <stop offset="100%" stop-color="#3d8f72" />
            </linearGradient>

            <linearGradient id="seabedFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1b4a6d" />
              <stop offset="100%" stop-color="#0c2a45" />
            </linearGradient>

            <!-- Keeps the stretching throat pleats inside the whale's
                 silhouette; without this they spill past the belly as the
                 breath fills and read as loose scribble. -->
            <clipPath id="whaleBodyClip">
              <path d="M196 292 C206 258 246 232 300 224 C356 216 420 226 474 246 C520 263 556 282 578 296 C590 304 592 312 584 320 C560 338 512 354 452 362 C378 372 306 366 258 348 C222 334 200 316 196 300 Z" />
            </clipPath>

            <!-- Body + chin together. The pale underside is shaded
                 against this union, so it wraps the whole ventral
                 surface instead of stopping at the body's edge and
                 leaving a hard band above the chin. -->
            <clipPath id="whaleVentralClip">
              <path d="M196 292 C206 258 246 232 300 224 C356 216 420 226 474 246 C520 263 556 282 578 296 C590 304 592 312 584 320 C560 338 512 354 452 362 C378 372 306 366 258 348 C222 334 200 316 196 300 Z" />
              <path d="M206 302 C214 330 246 352 298 362 C354 372 418 366 468 348 C436 372 362 382 300 374 C246 367 214 342 204 314 Z" />
            </clipPath>

            <!-- The jaw is a separate volume so the pleats and the mouth
                 line can live on it without bleeding onto the flank. -->
            <clipPath id="whaleJawClip">
              <path d="M206 302 C214 330 246 352 298 362 C354 372 418 366 468 348 C436 372 362 382 300 374 C246 367 214 342 204 314 Z" />
            </clipPath>
          </defs>

          <g id="background">
            <rect class="sea" x="-200" y="-400" width="1200" height="1400" fill="url(#deep)" />
            <rect class="sea-haze" x="-200" y="-400" width="1200" height="820" fill="url(#waterHaze)" />

            <!-- Light shafts from the surface, drifting with the breath.
                 Angled and unequal so they read as light through moving
                 water rather than as stripes. -->
            <g class="light-shafts">
              <polygon points="150,-60 226,-60 356,540 236,540" fill="url(#sunShaft)" />
              <polygon points="452,-60 506,-60 612,540 520,540" fill="url(#sunShaft)" />
              <polygon points="18,-60 58,-60 140,540 44,540" fill="url(#sunShaft)" />
              <polygon points="654,-60 690,-60 760,540 684,540" fill="url(#sunShaft)" />
            </g>
          </g>

          <g id="environment">
            <!-- Far silhouettes: a distant pod, barely visible. Drawn as
                 whale shapes rather than ellipses, so the depth cue is an
                 animal and not a smudge. -->
            <g class="layer-far">
              <path d="M96 160 C112 149 140 145 166 150 C186 154 200 160 206 165 C196 172 168 177 140 176 C118 175 102 169 94 164 Z" />
              <path d="M206 165 C214 160 222 155 231 151 C228 157 227 161 228 165 C227 169 228 173 231 179 C222 175 213 170 206 165 Z" />
              <path d="M660 212 C672 204 692 201 710 205 C723 208 732 213 736 216 C729 221 710 225 691 224 C675 223 664 219 658 216 Z" />
              <path d="M736 216 C742 213 748 210 754 207 C752 212 751 215 752 218 C751 221 752 224 754 228 C748 225 741 220 736 216 Z" />
            </g>

            <!-- A shoal, far off and small: it gives the midwater a scale
                 reference without adding clutter near the whale. -->
            <g class="shoal">
              <path d="M120 322 l9 -3 -3 3 3 3 z" />
              <path d="M138 314 l9 -3 -3 3 3 3 z" />
              <path d="M132 332 l9 -3 -3 3 3 3 z" />
              <path d="M154 326 l9 -3 -3 3 3 3 z" />
              <path d="M148 342 l9 -3 -3 3 3 3 z" />
              <path d="M168 336 l9 -3 -3 3 3 3 z" />
              <path d="M110 338 l9 -3 -3 3 3 3 z" />
            </g>

            <!-- Plankton motes the breath pushes around. -->
            <g class="drift-layer" id="drift-layer-whale" aria-hidden="true"></g>

            <!-- Bubbles rise from the blowhole on each exhale. -->
            <g class="mist-layer" id="mist-layer-whale" aria-hidden="true"></g>
          </g>

          <g id="character">
            <!-- Shadow cast down into the deep. The frog gets a reflection
                 for the same reason: without it the animal floats on the
                 background instead of sitting in the scene. -->
            <ellipse class="whale-shadow" cx="392" cy="446" rx="186" ry="30" aria-hidden="true" />

            <g class="whale" id="whale">
              <!-- Peduncle and flukes as one continuous taper: the wrist
                   narrows out of the body and the flukes spread from it,
                   so the tail is part of the animal, not an arrowhead
                   parked behind it. -->
              <g class="whale-tail">
                <path class="whale-peduncle" d="M548 288 C592 288 634 296 668 310 C636 330 594 340 548 340 C556 322 558 306 548 288 Z" />
                <path class="whale-fluke" d="M660 310 C682 288 712 266 744 252 C756 248 762 254 756 264 C740 284 726 300 720 312 C726 326 740 342 756 362 C762 372 756 378 744 374 C710 360 680 336 658 314 Z" />
                <path class="whale-fluke-shade" d="M660 310 C682 288 712 266 744 252 C756 248 762 254 756 264 C740 284 726 300 720 312 C700 314 678 313 658 312 Z" />
              </g>

              <!-- Far flipper, behind the body: a second limb is what
                   stops the whale reading as a flat cut-out. -->
              <path class="whale-flipper whale-flipper--far" d="M366 318 C380 342 392 368 398 392 C400 402 394 408 386 404 C370 388 352 358 344 330 Z" />

              <!-- Body: deep chest under a rounded rostrum, tapering back
                   to the wrist. The old outline was a symmetrical almond
                   with no jaw, which is what made it read as a blimp. -->
              <path class="whale-body" d="M196 292 C206 258 246 232 300 224 C356 216 420 226 474 246 C520 263 556 282 578 296 C590 304 592 312 584 320 C560 338 512 354 452 362 C378 372 306 366 258 348 C222 334 200 316 196 300 Z" fill="url(#whaleSkin)" />

              <!-- Everything that gives the skin its surface is clipped to
                   the silhouette: mottling, caustics, and the surface light.
                   The frog has speckles for the same reason — a single flat
                   fill reads as plastic. -->
              <g clip-path="url(#whaleBodyClip)">

                <!-- Mottled grey patches, the way a real humpback's flank is
                     never one tone. -->
                <g class="whale-mottle" aria-hidden="true">
                  <ellipse cx="352" cy="256" rx="52" ry="18" transform="rotate(-9 352 256)" />
                  <ellipse cx="462" cy="276" rx="44" ry="15" transform="rotate(-6 462 276)" />
                  <ellipse cx="286" cy="268" rx="32" ry="13" transform="rotate(-14 286 268)" />
                  <ellipse cx="528" cy="296" rx="30" ry="11" transform="rotate(-4 528 296)" />
                  <ellipse cx="402" cy="240" rx="34" ry="11" transform="rotate(-10 402 240)" />
                </g>

                <!-- Pale scarring along the flank — the detail that makes a
                     whale look like an animal that has lived somewhere. -->
                <g class="whale-scars" aria-hidden="true">
                  <path d="M376 292 C394 287 412 287 430 292" />
                  <path d="M444 306 C460 302 476 302 490 306" />
                  <path d="M322 286 C336 282 350 282 362 285" />
                  <path d="M400 318 C416 314 432 314 446 318" />
                </g>

                <!-- Caustic light pooling on the back. -->
                <g class="whale-dapples" aria-hidden="true">
                  <ellipse cx="336" cy="248" rx="40" ry="14" fill="url(#whaleDapple)" />
                  <ellipse cx="460" cy="266" rx="46" ry="15" fill="url(#whaleDapple)" />
                  <ellipse cx="264" cy="266" rx="28" ry="11" fill="url(#whaleDapple)" />

                <!-- Dark brow flashes, the markings that make a fox face
                     read as a fox rather than a generic dog. -->
                <path class="fox-brow" d="M324 296 C336 288 352 287 364 292 C350 292 334 295 324 301 Z" />
                <path class="fox-brow" d="M408 290 C398 283 384 282 374 286 C386 287 398 290 406 296 Z" />

                <ellipse class="fox-nose" cx="245" cy="350" rx="9" ry="7.5" transform="rotate(-20 245 350)" />
                <path class="fox-nose-line" d="M249 357 C251 361 253 364 256 366" />
              </g>
            </g>

            <!-- Frost breath from the muzzle. Drawn above the fox so the
                 puffs read in front of the face, not behind it. -->
            <g class="mist-layer" id="mist-layer-fox" aria-hidden="true"></g>
          </g>

          <g id="foreground">
            <!-- Snow banked against the fox, drawn over its lower edge so
                 the animal is bedded into the field rather than resting
                 on top of it. -->
            <path class="fox-snow-lip" d="M256 432 C310 450 348 456 400 456 C458 456 506 450 550 434 C526 458 458 470 396 470 C334 470 282 458 256 432 Z" aria-hidden="true" />

            <!-- Foreground drifts, lighter and softer than the field, to
                 hold the bottom corners. -->
            <path class="snow-bank" d="M-200 470 C-80 440 40 436 150 456 C230 470 280 484 320 500 L-200 500 Z" fill="url(#snowNear)" />
            <path class="snow-bank" d="M1000 462 C880 434 760 434 660 458 C580 477 530 488 496 500 L1000 500 Z" fill="url(#snowNear)" />
          </g>
        </svg>

        <!-- Fireflies live outside the SVG so they can be positioned in
             percentages against the pond box at any aspect ratio. -->
        <div class="fireflies" id="fireflies" aria-hidden="true"></div>

        <!-- Breath cue above the frog: the phase word plus its remaining
             seconds. aria-hidden because #status announces phase changes
             to screen readers without the per-second countdown. -->
        <p class="breath-cue" id="breath-cue" aria-hidden="true">
          <span class="breath-cue-word" id="breath-cue-word">In</span>
          <span class="breath-cue-count" id="breath-cue-count">4</span>
        </p>
      </div>

      <!-- Screen-reader-only. There is deliberately no visible countdown,
           progress bar or phase label: the pond itself is the cue. -->
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <div id="menu-backdrop" class="menu-backdrop" hidden></div>

    <aside id="menu-drawer" class="menu-drawer" hidden aria-label="Menu">
      <div class="menu-drawer-header">
        <h2 class="menu-drawer-title">Menu</h2>
        <button id="menu-close-btn" type="button" class="menu-close-btn" aria-label="Close menu">✕</button>
      </div>

      <div class="settings-groups menu-settings-groups">
        <div class="settings-row">
          <span class="settings-row-label" id="menu-scene-label">Place</span>
          <div class="segmented" role="group" aria-labelledby="menu-scene-label" id="menu-scene-options"></div>
        </div>

        <div class="settings-row">
          <span class="settings-row-label" id="menu-pattern-label">Breathing</span>
          <div class="segmented segmented--stack" role="group" aria-labelledby="menu-pattern-label" id="menu-pattern-options"></div>
        </div>

        <div class="settings-row">
          <span class="settings-row-label" id="menu-sound-label">Sound</span>
          <div class="segmented" role="group" aria-labelledby="menu-sound-label" id="menu-sound-options"></div>
        </div>
      </div>

      <p class="menu-hint">The frog breathes out, and the pond moves with him. Just watch, and breathe along.</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
